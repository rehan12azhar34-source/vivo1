          # Background Overlay Service
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/VivoOverlayService.kt
          package com.vivo.funtouch.shortcutcenter

          import android.annotation.SuppressLint
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.os.IBinder
          import android.provider.Settings
          import android.view.*
          import android.widget.TextView

          class VivoOverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var triggerView: View
              private lateinit var panelView: View
              private var isPanelOpen = false
              private var isTorchOn = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  setupBottomTrigger()
                  setupVivoPanel()
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupBottomTrigger() {
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      36,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.BOTTOM }

                  triggerView = View(this)
                  var startY = 0f
                  triggerView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> { startY = event.rawY; true }
                          MotionEvent.ACTION_MOVE -> {
                              if (startY - event.rawY > 40 && !isPanelOpen) showPanel()
                              true
                          }
                          else -> false
                      }
                  }
                  wm.addView(triggerView, params)
              }

              private fun setupVivoPanel() {
                  panelView = LayoutInflater.from(this).inflate(R.layout.layout_vivo_shortcut_center, null)
                  val brightness = panelView.findViewById<VivoVerticalSlider>(R.id.sliderBrightness)
                  val volume = panelView.findViewById<VivoVerticalSlider>(R.id.sliderVolume)
                  val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  brightness.iconText = "☀"
                  volume.iconText = "🔊"

                  volume.onProgressChanged = { pct ->
                      val max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, (pct * max).toInt(), 0)
                  }

                  brightness.onProgressChanged = { pct ->
                      if (Settings.System.canWrite(this)) {
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, (pct * 255).toInt())
                      }
                  }

                  // Flashlight Toggle
                  panelView.findViewById<TextView>(R.id.btnTorch).setOnClickListener { v ->
                      try {
                          val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                          isTorchOn = !isTorchOn
                          cm.setTorchMode(cm.cameraIdList[0], isTorchOn)
                          if (isTorchOn) {
                              v.setBackgroundResource(R.drawable.bg_circle_toggle_active)
                              (v as TextView).setTextColor(Color.BLACK)
                          } else {
                              v.setBackgroundResource(R.drawable.bg_circle_toggle_inactive)
                              (v as TextView).setTextColor(Color.WHITE)
                          }
                      } catch (e: Exception) {}
                  }

                  panelView.findViewById<View>(R.id.btnClose).setOnClickListener { hidePanel() }
                  panelView.findViewById<View>(R.id.panelOverlayRoot).setOnClickListener { hidePanel() }
              }

              private fun showPanel() {
                  if (isPanelOpen) return
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(panelView, params)
                  isPanelOpen = true
              }

              private fun hidePanel() {
                  if (!isPanelOpen) return
                  wm.removeView(panelView)
                  isPanelOpen = false
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::triggerView.isInitialized) wm.removeView(triggerView)
                  if (isPanelOpen) wm.removeView(panelView)
              }
          }
          EOF

          # MainActivity
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/MainActivity.kt
          package com.vivo.funtouch.shortcutcenter

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                  }

                  val btnOverlay = Button(this).apply {
                      text = "1. Grant Floating Window Permission"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }
                  }

                  val btnWrite = Button(this).apply {
                      text = "2. Grant Brightness Permission"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName")))
                      }
                  }

                  val btnStart = Button(this).apply {
                      text = "3. Start Shortcut Center"
                      setOnClickListener {
                          if (Settings.canDrawOverlays(this@MainActivity)) {
                              startService(Intent(this@MainActivity, VivoOverlayService::class.java))
                              Toast.makeText(this@MainActivity, "Shortcut Center Active! Swipe up from bottom edge", Toast.LENGTH_LONG).show()
                          } else {
                              Toast.makeText(this@MainActivity, "Please grant permission 1 first", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  layout.addView(btnOverlay)
                  layout.addView(btnWrite)
                  layout.addView(btnStart)
                  setContentView(layout)
              }
          }
          EOF

          gradle wrapper

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivo-Shortcut-Center-EN
          path: app/build/outputs/apk/debug/*.apk
