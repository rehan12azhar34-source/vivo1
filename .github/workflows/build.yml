name: Build Vivo Shortcut Center APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate English Vivo Project
        run: |
          mkdir -p app/src/main/java/com/vivo/funtouch/shortcutcenter
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VivoShortcutCenter"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.20' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.vivo.funtouch.shortcutcenter'
              compileSdk 33
              defaultConfig {
                  applicationId "com.vivo.funtouch.shortcutcenter"
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName "1.0_EN"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
          }
          EOF

          # Colors & Styles
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.VivoFuntouch" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowIsTranslucent">true</item>
              </style>
          </resources>
          EOF

          # Drawables
          cat << 'EOF' > app/src/main/res/drawable/bg_panel_blur.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E615171E" />
              <corners android:topLeftRadius="24dp" android:topRightRadius="24dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_service_card.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#26323D4D" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_toggle_inactive.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#403C4454" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_toggle_active.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFFFFFFF" />
          </shape>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

              <application
                  android:label="Shortcut Center"
                  android:theme="@style/Theme.VivoFuntouch">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".VivoOverlayService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # Custom Vivo Vertical Slider View
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/VivoVerticalSlider.kt
          package com.vivo.funtouch.shortcutcenter

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.MotionEvent
          import android.view.View

          class VivoVerticalSlider @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null, defStyle: Int = 0
          ) : View(context, attrs, defStyle) {

              var progress: Float = 0.5f
                  set(value) {
                      field = value.coerceIn(0f, 1f)
                      invalidate()
                  }

              var onProgressChanged: ((Float) -> Unit)? = null
              var iconText: String = "☀"

              private val trackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#403C4454") }
              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.BLACK
                  textSize = 40f
                  textAlign = Paint.Align.CENTER
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val radius = width / 2f
                  val rect = RectF(0f, 0f, width.toFloat(), height.toFloat())
                  canvas.drawRoundRect(rect, radius, radius, trackPaint)

                  val fillTop = height * (1f - progress)
                  val fillRect = RectF(0f, fillTop, width.toFloat(), height.toFloat())
                  canvas.drawRoundRect(fillRect, radius, radius, fillPaint)

                  canvas.drawText(iconText, width / 2f, height - 32f, textPaint)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                          val touchY = event.y.coerceIn(0f, height.toFloat())
                          progress = 1f - (touchY / height)
                          onProgressChanged?.invoke(progress)
                          return true
                      }
                  }
                  return super.onTouchEvent(event)
              }
          }
          EOF

